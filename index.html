<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keenen Wilkins</title>
</head>
<body>
    <h1>Welcome to Keenen Wilkins' Website</h1>
    <p>I am an intern in cycle 7</p>

    
    <iframe id="ytPlayer" width="560" height="315" 
            src="https://youtube.com" 
            frameborder="0" 
            allow="autoplay; encrypted-media; picture-in-picture" 
            allowfullscreen>
    </iframe>

    <br><br>

   
    <button id="magicButton">Click Me to Play Video!</button>

    <script>
      const button = document.getElementById('magicButton');
      const iframe = document.getElementById('ytPlayer');

      
      button.addEventListener('click', () => {
        iframe.src += "?autoplay=1&mute=1";
      });
    </script>
</body>
</html>
