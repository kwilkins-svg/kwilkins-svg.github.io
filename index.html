<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keenen Wilkins</title>
</head>
<body>
    <h1>Welcome to Keenen Wilkins' Website</h1>
    <p>I am an intern in cycle 7.</p>

    <button id="magicButton" type="button">Play YouTube Video</button>

    <iframe
      id="ytPlayer"
      src=""
      width="560"
      height="315"
      title="YouTube video player"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen>
    </iframe>

    <script>
      const button = document.getElementById('magicButton');
      const iframe = document.getElementById('ytPlayer');
      const videoUrl = 'https://www.youtube.com/embed/Aq5WXmQQooo?autoplay=1&mute=1';

      button.addEventListener('click', () => {
        iframe.src = videoUrl;
      });
    </script>
</body>
</html>
